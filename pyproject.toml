[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-discovery"
version = "0.1.0"
description = "Company research and outreach-prep automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
customer-discovery = "customer_discovery.cli:app"
customer_discovery = "customer_discovery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_discovery"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
